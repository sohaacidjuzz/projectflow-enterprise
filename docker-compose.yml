services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://projectflow:projectflow@postgres:5432/projectflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      UPLOAD_DIR: /app/server/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-ProjectFlow Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@projectflow.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
