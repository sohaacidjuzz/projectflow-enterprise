services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://projectflow:projectflow@postgres:5432/projectflow?schema=public
      JWT_SECRET: replace-with-a-long-random-production-secret
      UPLOAD_DIR: /app/server/uploads
      MAX_UPLOAD_MB: 10
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
